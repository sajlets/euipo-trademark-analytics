[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "euipo-trademark-analytics"
version = "0.1.0"
description = "EU trade mark filing KPIs with DuckDB and Streamlit"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.1,<2",
    "pandas>=2.2,<3",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
load-trademarks = "trademark_analytics.load_data:main"

[tool.setuptools.packages.find]
include = ["trademark_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

